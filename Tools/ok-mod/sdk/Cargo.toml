[package]
name = "ok-mod-sdk"
version = "0.1.0"
edition = "2021"
description = "OK mod framework SDK: the ok_mod! macro (root module export, panic isolation), host access, config and logging helpers."

[lib]
name = "ok_mod_sdk"

[features]
# Per-frame calls (ok_mod_frame!, frame.rs; Docs/OK_MOD_S11_FRAME.md, adopted at sync point B). A mod that takes frames turns it on.
frame = []
# Reading a card file's okMx/okMr directly (hooks::CardMod::read), for hooks that only get the card's path
# (material.post_texture). Pulls in zstd.
card-file = ["dep:ok-card-mods"]

[dependencies]
ok-mod-api = { path = "../api" }
# Hook payloads and replies are JSON; mod data travels as base64 (hooks.rs).
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"
# Resource hashes (hooks::resource_hash): okMr stores resources by sha256.
sha2 = "0.10"
ok-card-mods = { path = "../../ok-card-mods", optional = true }
