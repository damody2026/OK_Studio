[package]
name = "ok-mod-host"
version = "0.1.0"
edition = "2021"
description = "OK mod host: discovers Mods/, resolves dependencies, loads mod DLLs through abi_stable, dispatches events, isolates panics. Unreal loads it as ok_mod_host.dll (okm_* C ABI); the ok-extract CLI links the rlib."

[lib]
name = "ok_mod_host"
crate-type = ["cdylib", "rlib"]

[features]
# Per-frame mod calls (okm_frame; a mod's exported ok_mod_frame). Proposed in Docs/OK_MOD_S11_FRAME.md, waiting on the
# coordinator's decision, so off by default.
frame = []

[dependencies]
ok-mod-api = { path = "../api" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
semver = { workspace = true }
# okMx and the card identity, the same code as ok-extract (Tools/ok-card-mods); okMr is not written here yet.
ok-card-mods = { path = "../../ok-card-mods", default-features = false }
base64 = "0.22"
