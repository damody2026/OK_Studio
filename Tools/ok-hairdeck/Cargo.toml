[package]
name = "ok-hairdeck"
version = "0.1.0"
edition = "2021"
description = "HairDeck hair from one image without Python: DINOv3 ViT-L/16, card set DiT, card VAE, colour model, chain DiT (Docs/HAIRDECK.md)"

[features]
default = ["cuda"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[dependencies]
candle-core = "0.11"
candle-nn = "0.11"
safetensors = "0.8"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[profile.release]
debug = 1
