[package]
name = "ok-city-props"
version = "0.1.0"
edition = "2021"
description = "UniversityCity prop index: what objects, rooms, places and shops are near a point (radius queries on a 10 m grid). Standalone for now; meant to move into ok-rules as a module."

[lib]
name = "ok_city_props"
crate-type = ["rlib"]

[[bin]]
name = "ok-city-props"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
